name: FBI frequent sync (dérogations, calendrier, e-Marque)

# Le plan Vercel Hobby limite les crons vercel.json à une exécution par jour
# (voir docs/DEPLOYMENT.md) — /internal/cron/fbi-enqueue, /internal/cron/
# fbi-jobs et /internal/cron/emarque-parse y tournent donc une seule
# fois/jour, ce qui est beaucoup trop lent pour des dérogations à vérifier
# plusieurs fois par jour, pour rattraper plusieurs matchs d'un même weekend
# (constaté le 2026-09-29 : 9 matchs en attente auraient mis 9 jours à être
# traités au rythme d'1 job/jour), ou pour que les stats apparaissent peu
# après le téléchargement du document plutôt qu'à un horaire fixe. GitHub
# Actions (gratuit, hors Vercel) prend le relai ici toutes les 15 minutes —
# exactement la fréquence prévue à l'origine avant la contrainte du plan
# Hobby.
#
# Le parsing (emarque-parse) tourne dans CE MÊME workflow, juste après
# fbi-jobs, plutôt qu'à part sur son propre horaire (retour du club,
# 2026-09-29 : "le parsing doit etre appelé si des emarque ont été
# téléchargés") — sans risque à l'appeler aussi souvent : pas de Playwright
# ni de login FBI ici, juste de l'OCR/PDF local sur ce qui a déjà été
# téléchargé, donc aucun risque de blocage anti-bot FBI contrairement à
# fbi-jobs.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

# Une seule exécution à la fois (même compte FBI) : une exécution longue
# (plusieurs jobs, voir plus bas) met la suivante en attente, jamais en
# parallèle.
concurrency:
  group: fbi-frequent-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Synchro FFBB (scores, matchs passés en « joué », calendrier) — retour
      # du club, 2026-10-02 : elle n'était appelée QUE par le cron Vercel
      # quotidien (3h), alors qu'elle est prévue toutes les 15 min
      # (FFBB_SYNC_INTERVAL_MINUTES) : un match du samedi ne passait en
      # « joué » — donc n'entrait dans la file e-Marque — que le dimanche
      # matin. Auto-limitée côté API (un club n'est resynchronisé que s'il est
      # dû) ; un échec ici ne doit jamais empêcher les jobs FBI ci-dessous.
      - name: Synchroniser FFBB (scores, matchs joués)
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --max-time 240 \
            -X GET "https://club-manager-api-two.vercel.app/internal/cron/ffbb" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      # Notifications push iOS : rattrapage des envois en échec passager
      # (l'envoi normal est immédiat, au moment de l'action). Sans clé APNs
      # côté API : répond { "enabled": false } et ne fait rien.
      - name: Notifications push en attente
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --max-time 60 \
            -X GET "https://club-manager-api-two.vercel.app/internal/cron/push" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      # Diagnostic (2026-10-06) : FBI répond-il depuis une autre adresse que
      # Vercel ? Seuls le code HTTP et le temps de réponse sont affichés
      # (journal public : jamais de contenu de page ni d'identifiant).
      - name: Diagnostic — FBI joignable depuis GitHub
        continue-on-error: true
        # Résultat remonté en annotation (::notice::), lisible sans les journaux.
        run: |
          for i in 1 2 3; do
            r=$(curl --silent --output /dev/null --max-time 30 \
              --write-out "HTTP %{http_code} en %{time_total}s" \
              "https://extranet.ffbb.com/fbi/connexion.fbi" 2>&1) || r="injoignable ($r)"
            echo "::notice title=Sonde FBI depuis GitHub $i::$r"
            sleep 5
          done

      # FBI répond-il via notre accès (proxy) ? Une requête, sans identifiant ;
      # historique en base (fbi_reachability_checks). Résultat en annotation.
      - name: Joignabilité de FBI depuis l'API
        continue-on-error: true
        run: |
          r=$(curl --silent --show-error --max-time 60 \
            -X GET "https://club-manager-api-two.vercel.app/internal/cron/fbi-reachability" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" 2>&1) || true
          echo "::notice title=FBI depuis l'API::$r"

      # Empile les jobs récurrents (discover_emarque, reconcile_schedule,
      # check_all_derogations) — idempotent : ne duplique jamais un job déjà
      # en attente/en cours pour un club (contrainte unique côté DB).
      - name: Empiler les jobs FBI récurrents
        run: |
          curl --fail --silent --show-error --max-time 60 \
            -X GET "https://club-manager-api-two.vercel.app/internal/cron/fbi-enqueue" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      # Traite les jobs de la file (dérogation, calendrier ou téléchargement
      # e-Marque, le plus ancien en premier) UN PAR UN, chacun suivi du
      # parsing de ce qu'il a téléchargé. Retour du club, 2026-10-02 : à un
      # seul job par passage (4/heure), un weekend chargé mettait des heures
      # à se vider. Une pause de 30 s sépare deux jobs (des connexions FBI
      # enchaînées sans pause rendaient FBI injoignable), 4 jobs maximum.
      # Un échec n'arrête PLUS le passage (2026-10-06 : deux matchs en échec
      # répété bloquaient toute la file) — le job en échec est reprogrammé
      # au créneau suivant de son calendrier fixe ; seule une file vide
      # ("claimed": 0) termine le passage.
      - name: Traiter les jobs FBI en attente et parser les e-Marque
        run: |
          start=$(date +%s)
          for i in 1 2 3 4; do
            if [ "$i" -gt 1 ]; then
              if [ $(( $(date +%s) - start )) -gt 420 ]; then echo "Budget de temps atteint, la suite au prochain passage."; break; fi
              sleep 30
            fi
            out=$(curl --fail --silent --show-error --max-time 300 \
              -X GET "https://club-manager-api-two.vercel.app/internal/cron/fbi-jobs" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}") || { echo "fbi-jobs en échec (repris au prochain passage)"; break; }
            echo "fbi-jobs #$i : $out"
            echo "::notice title=fbi-jobs $i::$out"
            curl --fail --silent --show-error --max-time 280 \
              -X GET "https://club-manager-api-two.vercel.app/internal/cron/emarque-parse" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" || echo "emarque-parse en échec (repris au prochain passage)"
            echo
            case "$out" in *'"claimed":0'*) break ;; esac
          done
